{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "authentik-operator.fullname" . }}-manager
  labels:
    {{- include "authentik-operator.labels" . | nindent 4 }}
# Rules come from rbac-rules.yaml, which `make manifests` renders from
# config/rbac/role.yaml - itself generated from the +kubebuilder:rbac markers on
# the controllers.
#
# They were hand-written here once and drifted as soon as new CRDs landed: the
# operator installed cleanly and the pod reported Running while every reconciler
# logged "forbidden" and watched nothing. Keeping one source avoids repeating
# that quietly.
rules:
{{- .Files.Get "rbac-rules.yaml" | nindent 2 }}
{{- end }}
