---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: outposts.authentik.k8s.rka.sh
spec:
  group: authentik.k8s.rka.sh
  names:
    kind: Outpost
    listKind: OutpostList
    plural: outposts
    shortNames:
    - akoutpost
    singular: outpost
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.outpostID
      name: Outpost
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Outpost manages an authentik outpost and the set of providers
          it serves.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OutpostSpec defines an authentik outpost.

              An Outpost either describes an outpost for the operator to manage, in which
              case type is required, or points at one that already exists in authentik and
              is maintained elsewhere. The second is what the embedded outpost needs:
              authentik creates it, it is present in essentially every deployment, and it
              is the usual attachment point for proxy providers.
            properties:
              adoptionPolicy:
                default: FailOnConflict
                description: |-
                  AdoptionPolicy controls what happens when an outpost with this name
                  already exists in authentik.
                enum:
                - FailOnConflict
                - AdoptExisting
                type: string
              config:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Config is passed to authentik verbatim as the outpost's configuration.
                  The schema differs per outpost type and per authentik version, so it is
                  deliberately not modelled here.

                  Well-known keys include: "log_level", "authentik_host",
                  "authentik_host_browser", "authentik_host_insecure",
                  "object_naming_template", "refresh_interval", "kubernetes_replicas",
                  "kubernetes_namespace", "kubernetes_service_type",
                  "kubernetes_ingress_class_name", "kubernetes_ingress_annotations",
                  "kubernetes_ingress_secret_name", "kubernetes_image_pull_secrets",
                  "kubernetes_json_patches", "kubernetes_disabled_components",
                  "docker_network", "docker_map_ports", "docker_labels" and "docker_image".
                  Consult the authentik documentation for the set your version accepts.

                  Not accepted when referencing an existing outpost, whose configuration is
                  not this operator's to change. That is rejected by the controller rather
                  than by a validation rule: the field preserves unknown fields, which puts
                  it outside what CEL can see.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              connectionRef:
                description: |-
                  ConnectionRef selects the authentik instance this outpost is registered
                  with.
                properties:
                  kind:
                    default: AuthentikConnection
                    description: Kind of connection object being referenced.
                    enum:
                    - AuthentikConnection
                    - ClusterAuthentikConnection
                    type: string
                  name:
                    description: Name of the connection object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens to the authentik outpost when this
                  resource is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              embedded:
                description: |-
                  Embedded selects authentik's built-in embedded outpost, which exists in
                  every deployment and serves proxy providers without anything being
                  deployed.

                  It is found by the marker authentik stamps on it rather than by its
                  display name, which is editable and translated.
                type: boolean
              existingOutpostName:
                description: |-
                  ExistingOutpostName names an outpost that already exists in authentik and
                  is maintained outside the operator. The operator manages which providers
                  it serves and nothing else about it.
                maxLength: 255
                type: string
              name:
                description: Name is the outpost's name in authentik. Defaults to
                  the resource name.
                type: string
              serviceConnectionRef:
                description: |-
                  ServiceConnectionRef selects the service connection authentik uses to
                  deploy this outpost. Leave unset when you deploy the outpost yourself.
                properties:
                  dockerServiceConnectionName:
                    description: DockerServiceConnectionName names a DockerServiceConnection
                      resource.
                    maxLength: 253
                    type: string
                  existingServiceConnectionName:
                    description: |-
                      ExistingServiceConnectionName is the name of a service connection that
                      already exists in authentik and is maintained outside the operator. Use
                      it to deploy through one somebody else set up, of either kind.
                    maxLength: 255
                    type: string
                  kubernetesServiceConnectionName:
                    description: |-
                      KubernetesServiceConnectionName names a KubernetesServiceConnection
                      resource.
                    maxLength: 253
                    type: string
                  namespace:
                    description: |-
                      Namespace holding the resource. Defaults to the referring resource's own
                      namespace.

                      Naming another namespace requires the operator to be started with
                      cross-namespace references enabled; otherwise the reference is refused
                      rather than quietly resolved somewhere else.
                    maxLength: 63
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of kubernetesServiceConnectionName, dockerServiceConnectionName
                    or existingServiceConnectionName must be set
                  rule: '(has(self.kubernetesServiceConnectionName) ? 1 : 0) + (has(self.dockerServiceConnectionName)
                    ? 1 : 0) + (has(self.existingServiceConnectionName) ? 1 : 0) ==
                    1'
              type:
                description: |-
                  Type selects which outpost implementation authentik registers. Required
                  when this resource manages the outpost; omitted when it references one
                  that already exists, whose type is not this operator's to change.
                enum:
                - proxy
                - ldap
                - radius
                - rac
                type: string
              writeTokenTo:
                description: |-
                  WriteTokenTo creates a Secret holding the outpost's API token and the
                  authentik base URL, which is what a self-hosted outpost needs in order to
                  connect back. Leave unset when authentik deploys the outpost itself.
                properties:
                  hostKey:
                    default: authentik-host
                    description: |-
                      HostKey is the Secret key holding the authentik base URL, which a
                      self-hosted outpost passes as AUTHENTIK_HOST.
                    type: string
                  name:
                    description: Name of the Secret to create in this resource's namespace.
                    minLength: 1
                    type: string
                  tokenKey:
                    default: token
                    description: |-
                      TokenKey is the Secret key holding the outpost API token, which a
                      self-hosted outpost passes as AUTHENTIK_TOKEN.
                    type: string
                required:
                - name
                type: object
            required:
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: set exactly one of type (to manage an outpost), existingOutpostName,
                or embedded
              rule: '(has(self.type) ? 1 : 0) + (has(self.existingOutpostName) ? 1
                : 0) + ((has(self.embedded) && self.embedded) ? 1 : 0) == 1'
            - message: name and serviceConnectionRef describe an outpost this operator
                manages, so they cannot be set when referencing an existing one
              rule: has(self.type) || (!has(self.serviceConnectionRef) && !has(self.name))
          status:
            description: OutpostStatus reports the outpost's state in authentik.
            properties:
              adopted:
                description: |-
                  Adopted records that this resource took over a pre-existing authentik
                  object rather than creating it.
                type: boolean
              authentikURL:
                description: |-
                  AuthentikURL is the instance this object was reconciled against.

                  A reference from another namespace compares this against its own
                  connection and refuses a mismatch. It matters more here than for a UUID:
                  providers are keyed by a small integer, so a primary key from a different
                  authentik will very likely name some other provider rather than fail.
                type: string
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncedTime:
                description: LastSyncedTime is when the resource last reconciled successfully.
                format: date-time
                type: string
              managedProviderIDs:
                description: |-
                  ManagedProviderIDs are the providers this operator attached.

                  Membership is additive, and the difference between "someone attached this
                  by hand" and "the operator attached it and the reference is now gone"
                  cannot be read from the spec -- the two demand opposite actions. This is
                  the record that tells them apart, so detaching only ever removes what the
                  operator put there.
                items:
                  format: int32
                  type: integer
                type: array
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  reflects.
                format: int64
                type: integer
              outpostID:
                description: OutpostID is authentik's UUID for this outpost.
                type: string
              providerIDs:
                description: |-
                  ProviderIDs are the authentik primary keys of every provider currently
                  attached to this outpost, including any attached outside the operator.
                items:
                  format: int32
                  type: integer
                type: array
              remoteID:
                description: |-
                  RemoteID is authentik's own identifier for the managed object: a numeric
                  primary key for providers and applications, a UUID elsewhere.

                  Once set this is the authoritative handle for the object. Lookups prefer
                  it over the name, so that renaming the object on either side does not
                  cause the operator to lose track of it and create a duplicate.
                type: string
              remoteName:
                description: RemoteName is the name or slug last observed in authentik.
                  Informational.
                type: string
              serviceConnectionID:
                description: ServiceConnectionID is the UUID serviceConnectionRef
                  resolved to.
                type: string
              tokenIdentifier:
                description: |-
                  TokenIdentifier names the authentik token this outpost authenticates
                  with. It is an identifier, not the token itself, which is never placed
                  in status.
                type: string
              tokenSecretName:
                description: TokenSecretName is the Secret the outpost token was written
                  to.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
