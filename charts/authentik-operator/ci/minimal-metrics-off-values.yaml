# The other end of the range: metrics off entirely, no leader election, a
# single watched namespace, and terse logging.
#
# The chart still creates the ServiceAccount and RBAC. Turning those off is a
# real configuration, but chart-testing installs into a namespace it creates
# itself, so a pre-provisioned ServiceAccount cannot exist there and the
# ReplicaSet is refused. That variant lives in
# test-values/render-minimal.yaml and is covered by `helm template`.
leaderElection:
  enabled: false
watchNamespaces:
  - authentik
metrics:
  enabled: false
  service:
    enabled: false
  serviceMonitor:
    enabled: false
log:
  level: error
  format: console
