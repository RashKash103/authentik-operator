# Exercises the chart's optional features in a configuration that can actually
# be INSTALLED, because chart-testing installs every values file in ci/.
#
# Values that only make sense for rendering - a private registry, a pinned
# digest, pull secrets, multiple replicas with required anti-affinity - live in
# test-values/render-full.yaml and are covered by `helm template` instead. They
# cannot be installed: the image does not exist, and required hostname
# anti-affinity can never schedule two replicas on a single-node kind cluster.
replicaCount: 1

podAnnotations:
  example.com/purpose: chart-testing
podLabels:
  example.com/tier: platform

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

leaderElection:
  enabled: true

log:
  level: debug
  format: json

metrics:
  enabled: true
  secure: true
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s

extraEnv:
  - name: EXAMPLE_FLAG
    value: "true"

extraVolumes:
  - name: custom-ca
    secret:
      secretName: internal-ca
      # chart-testing installs into a namespace it creates itself, so this
      # Secret cannot be pre-created. Without optional, the kubelet blocks the
      # mount indefinitely and the pod never starts - which `helm template`
      # cannot catch, because only a real install schedules anything.
      optional: true
  - name: tmp
    emptyDir: {}

extraVolumeMounts:
  - name: custom-ca
    mountPath: /etc/ssl/custom
    readOnly: true
  - name: tmp
    mountPath: /tmp
