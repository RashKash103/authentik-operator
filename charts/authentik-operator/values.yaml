# =============================================================================
# authentik-operator - Helm values
# =============================================================================
#
# This chart installs THE OPERATOR ONLY. It does not install authentik, a
# database, or a cache. Point the operator at an authentik instance you already
# run by creating an AuthentikConnection (namespaced) or a
# ClusterAuthentikConnection (cluster-scoped) after install - see NOTES.txt.
#
# Every key below is documented: what it does, and when you would change it.
# The defaults are production-sane; a plain `helm install` needs no overrides.
# -----------------------------------------------------------------------------

# -- Number of operator Pods.
# Leave at 1. The operator is a singleton by design: leader election (see
# `leaderElection.enabled`) means only one replica ever reconciles, so extra
# replicas buy faster failover at the cost of an idle Pod. Raise to 2 only if
# you need sub-second takeover during node drains.
replicaCount: 1

image:
  # -- Operator image repository. Change only when mirroring into a private
  # registry (air-gapped clusters, or a pull-through cache).
  repository: ghcr.io/rashkash103/authentik-operator
  # -- Image tag. Empty string means "use the chart's appVersion", which keeps
  # chart and operator in lockstep. Pin an explicit tag - or better, a digest
  # via `image.digest` - if you promote images independently of chart versions.
  tag: ""
  # -- Image digest (e.g. `sha256:abc...`). When set it wins over `tag` and the
  # image is referenced as `repository@digest`. Use this for immutable,
  # supply-chain-verifiable deploys.
  digest: ""
  # -- Image pull policy. `IfNotPresent` is right for released, immutable tags.
  # Use `Always` only when you deploy a moving tag such as `main` or `latest`.
  pullPolicy: IfNotPresent

# -- Names of pre-existing image pull Secrets, e.g. `[{name: ghcr-creds}]`.
# Needed only when `image.repository` is private. The Secret must already exist
# in the release namespace; this chart does not create it.
imagePullSecrets: []

# -- Override the chart name portion of generated resource names.
# Rarely needed. Affects names and the `app.kubernetes.io/name` label.
nameOverride: ""
# -- Replace the generated `<release>-<chart>` resource name entirely.
# Use when you must match an existing naming convention or shorten names that
# would otherwise exceed the 63-character label limit.
fullnameOverride: ""

serviceAccount:
  # -- Create the ServiceAccount. Set to false if your platform team
  # pre-provisions ServiceAccounts (e.g. with IRSA / Workload Identity
  # annotations managed elsewhere); then set `serviceAccount.name`.
  create: true
  # -- Name of the ServiceAccount. Empty means the generated fullname when
  # `create` is true, or `default` when it is false. Required when
  # `create: false` and you are not using the `default` ServiceAccount.
  name: ""
  # -- Annotations for the ServiceAccount. The usual reason to set these is
  # cloud workload identity (`eks.amazonaws.com/role-arn`, `iam.gke.io/...`).
  annotations: {}
  # -- Mount the ServiceAccount token into the Pod. The operator talks to the
  # API server, so this must stay true unless you inject credentials another
  # way (e.g. a projected token from a sidecar).
  automountServiceAccountToken: true

rbac:
  # -- Create the ClusterRole/ClusterRoleBinding and the namespaced
  # leader-election Role/RoleBinding. Set to false only when RBAC is managed
  # out-of-band by a cluster admin; the operator will not function without
  # equivalent permissions.
  create: true

# -- Extra annotations for the operator Pod. Common uses: service-mesh opt-out
# (`linkerd.io/inject: disabled`), Vault agent injection, or forcing a rollout
# by stamping a checksum.
podAnnotations: {}
# -- Extra labels for the operator Pod. Useful for cost allocation, NetworkPolicy
# selectors, or scrape-target selection by an agent other than Prometheus.
podLabels: {}

# -- Pod-level security context. These defaults mirror `config/manager` and
# satisfy the Kubernetes `restricted` Pod Security Standard. Change only if a
# policy engine in your cluster demands different (e.g. explicit `runAsUser`).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. The operator writes nothing to disk, so
# the root filesystem is read-only and all capabilities are dropped. If you add
# an `extraVolumeMounts` entry that needs writing, mount an `emptyDir` rather
# than relaxing `readOnlyRootFilesystem`.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- CPU/memory requests and limits. The operator is event-driven and mostly
# idle; requests are deliberately small so it schedules anywhere. Raise limits
# if you manage thousands of resources or see OOMKills / CPU throttling.
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Node selector for the operator Pod, e.g. `{kubernetes.io/os: linux}`.
# Use to keep the operator on a control-plane-adjacent or system node pool.
nodeSelector: {}

# -- Tolerations for the operator Pod. Needed when the only nodes it may run on
# carry taints (dedicated system pools, control-plane nodes).
tolerations: []

# -- Affinity/anti-affinity rules. With `replicaCount: 2` add pod anti-affinity
# so both replicas do not land on the same node, defeating the point.
affinity: {}

# -- Topology spread constraints. An alternative to `affinity` for spreading
# replicas across zones or nodes.
topologySpreadConstraints: []

# -- PriorityClass for the operator Pod, e.g. `system-cluster-critical`.
# Set this if you want the operator to survive node pressure eviction ahead of
# workload Pods. The PriorityClass must already exist.
priorityClassName: ""

# -- Grace period before SIGKILL. The manager stops its controllers and
# releases the leader lease on SIGTERM; 10s is ample. Raise only if you see
# reconciles being cut off mid-flight.
terminationGracePeriodSeconds: 10

# -- DNS policy for the Pod. Change to `None` (plus `dnsConfig`) only in
# clusters with unusual DNS topology.
dnsPolicy: ""
# -- Custom DNS settings, used when `dnsPolicy: None`.
dnsConfig: {}

# -- Host aliases injected into /etc/hosts. Occasionally needed when the
# authentik URL resolves only via a private DNS the cluster cannot reach.
hostAliases: []

# -- Extra environment variables for the manager container, in full Kubernetes
# `env` form (so `valueFrom` works). Typical uses: `HTTPS_PROXY`/`NO_PROXY` for
# egress to authentik, or `SSL_CERT_FILE` pointing at a mounted CA bundle.
# Example:
#   extraEnv:
#     - name: HTTPS_PROXY
#       value: http://proxy.internal:3128
#     - name: SSL_CERT_FILE
#       value: /etc/ssl/custom/ca.crt
extraEnv: []

# -- Extra command-line flags appended to `/manager`, e.g.
# `["--kube-api-qps=50"]`. The chart already renders every flag it models;
# use this as an escape hatch for flags added after this chart version.
extraArgs: []

# -- Extra volumes on the Pod, in full Kubernetes `volumes` form. Most often a
# Secret or ConfigMap holding a private CA bundle for the authentik endpoint,
# or an `emptyDir` to give a writable path alongside the read-only rootfs.
extraVolumes: []
# -- Extra volume mounts on the manager container, matching `extraVolumes`.
extraVolumeMounts: []

# -- Extra arbitrary Kubernetes manifests rendered with the release. Strings are
# passed through `tpl`, so Helm templating works inside them. Use for a
# NetworkPolicy or PodDisruptionBudget you want to live with the release.
extraObjects: []

log:
  # -- Log verbosity: `debug`, `info` or `error` (maps to `--zap-log-level`).
  # Use `debug` when diagnosing reconcile behaviour; it is noisy in steady state.
  level: info
  # -- Log encoding: `json` for log pipelines (Loki, ELK, Datadog), `console`
  # for human-readable output while debugging locally (maps to `--zap-encoder`).
  format: json

leaderElection:
  # -- Enable leader election (`--leader-elect`). Keep true: with it off, two
  # replicas - including the brief overlap during a rolling update - would
  # reconcile the same objects and fight each other.
  enabled: true

# -- Namespaces the operator watches, as a list. Empty means all namespaces
# (cluster-wide) and is the default. Restricting this shrinks cache memory and
# blast radius, but the operator will silently ignore resources elsewhere, and
# ClusterAuthentikConnection remains cluster-scoped regardless.
# Example: `watchNamespaces: ["apps", "platform"]`
watchNamespaces: []

# -- Allow a Flow, PropertyMapping, CertificateKeyPair, provider or service
# connection reference to name another namespace. Off by default.
#
# Turning it on makes one namespace's configuration another's dependency, which
# is a cluster-level decision rather than one a manifest author should make for
# themselves. It does NOT apply to `connectionRef`: credentials never cross a
# namespace boundary this way. Share a connection with a
# ClusterAuthentikConnection instead, where the owner grants access through
# `allowedNamespaces`.
allowCrossNamespaceReferences: false

health:
  # -- Container port for the health/readiness endpoints (`/healthz`, `/readyz`).
  # Change only on a port collision with an injected sidecar.
  port: 8081

# -- Liveness probe for the manager. Tune `initialDelaySeconds` upward on very
# slow nodes where the cache takes a while to sync.
livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

# -- Readiness probe for the manager. Governs when the Pod starts counting as
# available during a rolling update.
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

# -- Enable HTTP/2 on the metrics endpoint (`--enable-http2`). Off by default:
# HTTP/2 has a history of DoS-shaped CVEs (Rapid Reset) and the operator's
# endpoints gain nothing from it. Turn on only if a scraper requires it.
enableHTTP2: false

metrics:
  # -- Serve controller-runtime metrics. When false the metrics bind address is
  # set to `0` (disabled) and no Service is created.
  enabled: true
  # -- Port the metrics endpoint binds to inside the container.
  port: 8443
  # -- Serve metrics over HTTPS with authn/authz (`--metrics-secure`). Keep true
  # in shared clusters: it forces scrapers to present a token that passes a
  # SubjectAccessReview. Setting false serves plaintext HTTP to anything that
  # can reach the Pod - only acceptable on an isolated network.
  secure: true

  service:
    # -- Create a Service for the metrics endpoint. Disable if you scrape Pods
    # directly (e.g. a PodMonitor or a DaemonSet agent using Pod annotations).
    enabled: true
    # -- Service type. `ClusterIP` is correct; metrics should never be exposed
    # outside the cluster.
    type: ClusterIP
    # -- Service port. Usually mirrors `metrics.port`.
    port: 8443
    # -- Extra annotations on the metrics Service, e.g. annotation-based scrape
    # config for agents that do not use ServiceMonitors.
    annotations: {}
    # -- Extra labels on the metrics Service. Set these when your Prometheus
    # `serviceMonitorSelector` matches on Service labels.
    labels: {}

  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor. Requires the
    # `monitoring.coreos.com/v1` CRD to exist; leave false otherwise or the
    # install fails on an unknown kind.
    enabled: false
    # -- Namespace to create the ServiceMonitor in. Empty means the release
    # namespace. Set when Prometheus only watches a dedicated namespace.
    namespace: ""
    # -- Extra labels on the ServiceMonitor. Must match your Prometheus
    # `serviceMonitorSelector` (e.g. `{release: kube-prometheus-stack}`), or the
    # ServiceMonitor is created and silently never scraped.
    labels: {}
    # -- Annotations on the ServiceMonitor.
    annotations: {}
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout. Empty means Prometheus' default. Must not exceed
    # `interval`.
    scrapeTimeout: ""
    # -- Path to scrape.
    path: /metrics
    # -- Scheme. Must be `https` when `metrics.secure` is true, `http` otherwise.
    # Empty means the chart derives it from `metrics.secure`.
    scheme: ""
    # -- Bearer token file presented to the metrics endpoint. With
    # `metrics.secure` the endpoint authorises via SubjectAccessReview, so
    # Prometheus must send its own ServiceAccount token.
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    # -- TLS settings for the scrape. The metrics server uses a self-signed
    # certificate by default, hence `insecureSkipVerify`. Replace with a `ca`
    # reference if you front the endpoint with a cert-manager certificate.
    tlsConfig:
      insecureSkipVerify: true
    # -- Keep label values from the target when they collide with Prometheus'.
    honorLabels: false
    # -- `relabel_configs` applied before the scrape.
    relabelings: []
    # -- `metric_relabel_configs` applied after the scrape. Use to drop the
    # high-cardinality controller-runtime histograms if they cost you.
    metricRelabelings: []
