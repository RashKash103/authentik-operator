# Shape only - do NOT commit this with a real token in `stringData`.
#
# Encrypt it first:
#
#   sops --encrypt --in-place secret.sops.yaml
#
# and let the Flux Kustomization decrypt it:
#
#   spec:
#     decryption:
#       provider: sops
#       secretRef:
#         name: sops-age
#
# Create the token in authentik under Directory > Tokens with the "api" intent,
# scoped as narrowly as the resources you manage allow.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-api-token
  namespace: identity
type: Opaque
stringData:
  token: REPLACE_ME_THEN_ENCRYPT
