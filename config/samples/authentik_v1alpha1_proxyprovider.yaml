# A forward-auth provider, the usual shape when an ingress controller asks
# authentik whether a request is allowed through.
#
# Note there is no internalHost: forward modes have nothing to forward to, and
# setting one is rejected at apply time by a validation rule on the CRD.
apiVersion: authentik.k8s.rka.sh/v1alpha1
kind: ProxyProvider
metadata:
  name: internal-tools
  namespace: default
spec:
  connectionRef:
    name: primary
  authorizationFlow:
    name: provider-authorization
  invalidationFlow:
    name: provider-invalidation

  externalHost: https://tools.example.com
  mode: forward_single

  # The outposts that should serve this provider. Declaring it here rather than
  # on the outpost means adding a provider is one manifest change; the outpost's
  # membership is reconciled additively, so providers attached to it outside the
  # operator are left alone.
  outpostRefs:
    - name: edge-proxy
    - name: embedded

  # Paths that bypass authentication entirely, one regular expression per line.
  skipPathRegex: |
    ^/healthz$
    ^/metrics$
