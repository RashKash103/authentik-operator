# A proxy outpost you deploy yourself, plus authentik's embedded one.
#
# Membership is declared on the provider, not here: a provider names the
# outposts that should serve it, so onboarding an application is one manifest
# change rather than two. See authentik_v1alpha1_proxyprovider.yaml.
#
# Every provider naming an outpost must resolve before the outpost is
# registered. A partially registered outpost comes up and silently leaves the
# rest of its applications unprotected, so the operator waits instead.
apiVersion: authentik.k8s.rka.sh/v1alpha1
kind: Outpost
metadata:
  name: edge-proxy
  namespace: default
spec:
  connectionRef:
    name: primary
  type: proxy

  # The token a self-hosted outpost needs to call back to authentik, written
  # into a Secret alongside the authentik URL. Mount it into your outpost
  # Deployment as AUTHENTIK_TOKEN and AUTHENTIK_HOST.
  writeTokenTo:
    name: edge-proxy-outpost
    tokenKey: token
    hostKey: authentik-host
---
# authentik's built-in outpost, which exists in every deployment and needs
# nothing deployed. Referencing it lets providers attach to it; the operator
# changes which providers it serves and nothing else about it, and never
# deletes it.
apiVersion: authentik.k8s.rka.sh/v1alpha1
kind: Outpost
metadata:
  name: embedded
  namespace: default
spec:
  connectionRef:
    name: primary
  embedded: true
