# CRD manifests generated by controller-gen into bases/.
# Regenerate with `make manifests`; add new files here as CRDs are added.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bases/authentik.k8s.rka.sh_applications.yaml
  - bases/authentik.k8s.rka.sh_authentikconnections.yaml
  - bases/authentik.k8s.rka.sh_certificatekeypairs.yaml
  - bases/authentik.k8s.rka.sh_clusterauthentikconnections.yaml
  - bases/authentik.k8s.rka.sh_dockerserviceconnections.yaml
  - bases/authentik.k8s.rka.sh_flows.yaml
  - bases/authentik.k8s.rka.sh_kubernetesserviceconnections.yaml
  - bases/authentik.k8s.rka.sh_oauth2providers.yaml
  - bases/authentik.k8s.rka.sh_outposts.yaml
  - bases/authentik.k8s.rka.sh_propertymappings.yaml
  - bases/authentik.k8s.rka.sh_proxyproviders.yaml
  - bases/authentik.k8s.rka.sh_samlproviders.yaml
