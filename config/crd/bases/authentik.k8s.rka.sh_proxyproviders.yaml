---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: proxyproviders.authentik.k8s.rka.sh
spec:
  group: authentik.k8s.rka.sh
  names:
    kind: ProxyProvider
    listKind: ProxyProviderList
    plural: proxyproviders
    shortNames:
    - akproxy
    singular: proxyprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.externalHost
      name: External Host
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.providerID
      name: Provider
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProxyProvider manages a proxy provider in authentik.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProxyProviderSpec defines a proxy provider served by an authentik outpost.

              The forwarding modes have no upstream of their own: an existing reverse
              proxy already holds the connection and only asks authentik whether to allow
              it. Rejecting the combination here turns a silently ignored field into an
              error on apply.
              The emptiness test uses size() rather than a comparison against an empty
              string literal: a pair of adjacent single quotes inside a comment is
              rewritten by gofmt into a typographic quote, which silently corrupts the
              rule.
            properties:
              accessTokenValidity:
                description: AccessTokenValidity in authentik duration syntax, e.g.
                  "hours=24".
                pattern: ^(((microseconds|milliseconds|seconds|minutes|hours|days|weeks)=-?\d+);?)+$
                type: string
              adoptionPolicy:
                default: FailOnConflict
                description: |-
                  AdoptionPolicy controls what happens when a provider with this name
                  already exists in authentik.
                enum:
                - FailOnConflict
                - AdoptExisting
                type: string
              authenticationFlow:
                description: |-
                  AuthenticationFlow is the flow used to authenticate a user who reaches
                  the application unauthenticated. Leave unset to use authentik's default.
                properties:
                  name:
                    description: Name of the Flow resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace holding the resource. Defaults to the referring resource's own
                      namespace.

                      Naming another namespace requires the operator to be started with
                      cross-namespace references enabled; otherwise the reference is refused
                      rather than quietly resolved somewhere else.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              authorizationFlow:
                description: AuthorizationFlow is the flow used when authorizing this
                  provider.
                properties:
                  name:
                    description: Name of the Flow resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace holding the resource. Defaults to the referring resource's own
                      namespace.

                      Naming another namespace requires the operator to be started with
                      cross-namespace references enabled; otherwise the reference is refused
                      rather than quietly resolved somewhere else.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              basicAuthEnabled:
                description: |-
                  BasicAuthEnabled sends HTTP Basic credentials to the upstream, for
                  applications that cannot read authentication headers.
                type: boolean
              basicAuthPasswordAttribute:
                description: |-
                  BasicAuthPasswordAttribute is the user attribute holding the password
                  sent as HTTP Basic credentials.
                type: string
              basicAuthUserAttribute:
                description: |-
                  BasicAuthUserAttribute is the user attribute holding the username sent
                  as HTTP Basic credentials.
                type: string
              certificate:
                description: |-
                  Certificate is the certificate key pair presented for the external
                  host.
                properties:
                  name:
                    description: Name of the CertificateKeyPair resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace holding the resource. Defaults to the referring resource's own
                      namespace.

                      Naming another namespace requires the operator to be started with
                      cross-namespace references enabled; otherwise the reference is refused
                      rather than quietly resolved somewhere else.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              connectionRef:
                description: ConnectionRef selects the authentik instance this provider
                  lives in.
                properties:
                  kind:
                    default: AuthentikConnection
                    description: Kind of connection object being referenced.
                    enum:
                    - AuthentikConnection
                    - ClusterAuthentikConnection
                    type: string
                  name:
                    description: Name of the connection object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              cookieDomain:
                description: |-
                  CookieDomain is the domain the session cookie is issued for. Set it in
                  forward_domain mode so one session covers every application on the
                  domain.
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens to the authentik provider when this
                  resource is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              externalHost:
                description: |-
                  ExternalHost is the URL the application is reached on by users, for
                  example "https://grafana.example.com". It is what the outpost matches
                  incoming requests against.
                minLength: 1
                type: string
              interceptHeaderAuth:
                description: |-
                  InterceptHeaderAuth makes the outpost handle Authorization headers sent
                  by the client instead of passing them through to the application.
                type: boolean
              internalHost:
                description: |-
                  InternalHost is the upstream the outpost forwards traffic to, for
                  example "http://grafana.monitoring.svc.cluster.local:3000". Valid only
                  in proxy mode.
                type: string
              internalHostSSLValidation:
                description: |-
                  InternalHostSSLValidation verifies the upstream's TLS certificate.
                  Disable it only for an upstream using a self-signed certificate.
                type: boolean
              invalidationFlow:
                description: InvalidationFlow is the flow used when ending a session.
                properties:
                  name:
                    description: Name of the Flow resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace holding the resource. Defaults to the referring resource's own
                      namespace.

                      Naming another namespace requires the operator to be started with
                      cross-namespace references enabled; otherwise the reference is refused
                      rather than quietly resolved somewhere else.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              mode:
                default: proxy
                description: |-
                  Mode selects how the outpost serves the application: proxy terminates
                  traffic and forwards it upstream, while the forward modes authorize
                  requests for an existing reverse proxy.
                enum:
                - proxy
                - forward_single
                - forward_domain
                type: string
              name:
                description: Name is the provider's name in authentik. Defaults to
                  the resource name.
                type: string
              outpostRefs:
                description: |-
                  OutpostRefs are the outposts that should serve this provider.

                  The provider names the outposts rather than the outpost naming its
                  providers, so adding one provider is one manifest change. An outpost's
                  membership is reconciled additively: providers attached to it outside
                  this operator are left alone, and removing a reference here detaches only
                  what this operator attached.
                items:
                  description: |-
                    OutpostReference points at an Outpost resource.

                    Providers name the outposts that should serve them, rather than an outpost
                    listing its providers. Membership therefore lives with the thing being added:
                    onboarding an application edits that application's manifests and nothing
                    else, instead of also editing a shared outpost every team has to touch.
                  properties:
                    name:
                      description: Name of the Outpost resource.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: |-
                        Namespace holding the resource. Defaults to the referring resource's own
                        namespace.

                        Naming another namespace requires the operator to be started with
                        cross-namespace references enabled; otherwise the reference is refused
                        rather than quietly resolved somewhere else.
                      maxLength: 63
                      type: string
                  required:
                  - name
                  type: object
                type: array
              propertyMappings:
                description: PropertyMappings attached to this provider, in order.
                items:
                  description: |-
                    PropertyMappingReference points at a PropertyMapping resource in the same
                    namespace.
                  properties:
                    name:
                      description: Name of the PropertyMapping resource.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: |-
                        Namespace holding the resource. Defaults to the referring resource's own
                        namespace.

                        Naming another namespace requires the operator to be started with
                        cross-namespace references enabled; otherwise the reference is refused
                        rather than quietly resolved somewhere else.
                      maxLength: 63
                      type: string
                  required:
                  - name
                  type: object
                type: array
              refreshTokenValidity:
                description: RefreshTokenValidity in authentik duration syntax, e.g.
                  "days=30".
                pattern: ^(((microseconds|milliseconds|seconds|minutes|hours|days|weeks)=-?\d+);?)+$
                type: string
              skipPathRegex:
                description: |-
                  SkipPathRegex lists paths that bypass authentication, one regular
                  expression per line. Use it for health checks and public assets.

                  Every request matching one of these expressions reaches the application
                  unauthenticated, so keep the expressions anchored and narrow.
                type: string
            required:
            - authorizationFlow
            - connectionRef
            - externalHost
            - invalidationFlow
            type: object
            x-kubernetes-validations:
            - message: internalHost is only valid when mode is proxy; forward_single
                and forward_domain have no upstream to forward to
              rule: '!((has(self.mode) && (self.mode == ''forward_single'' || self.mode
                == ''forward_domain'')) && has(self.internalHost) && size(self.internalHost)
                > 0)'
          status:
            description: ProxyProviderStatus reports the provider's state in authentik.
            properties:
              adopted:
                description: |-
                  Adopted records that this resource took over a pre-existing authentik
                  object rather than creating it.
                type: boolean
              authentikURL:
                description: |-
                  AuthentikURL is the instance this object was reconciled against.

                  A reference from another namespace compares this against its own
                  connection and refuses a mismatch. It matters more here than for a UUID:
                  providers are keyed by a small integer, so a primary key from a different
                  authentik will very likely name some other provider rather than fail.
                type: string
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncedTime:
                description: LastSyncedTime is when the resource last reconciled successfully.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  reflects.
                format: int64
                type: integer
              outposts:
                description: |-
                  Outposts names the outposts currently serving this provider. A proxy
                  provider that no outpost serves is unreachable, so an empty list is the
                  usual explanation for an application that cannot be opened.
                items:
                  type: string
                type: array
              providerID:
                description: |-
                  ProviderID is authentik's numeric primary key for this provider. It is
                  what an Application or Outpost must reference, so it is surfaced
                  separately from the generic RemoteID string.
                format: int32
                type: integer
              remoteID:
                description: |-
                  RemoteID is authentik's own identifier for the managed object. Its shape
                  differs by kind: a numeric primary key for providers, the slug for an
                  application, and a UUID for everything else.

                  Once set this is the authoritative handle for the object. Lookups prefer
                  it over the name, so that renaming the object on either side does not
                  cause the operator to lose track of it and create a duplicate.
                type: string
              remoteName:
                description: RemoteName is the name or slug last observed in authentik.
                  Informational.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
