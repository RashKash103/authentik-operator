---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: outposts.authentik.k8s.rka.sh
spec:
  group: authentik.k8s.rka.sh
  names:
    kind: Outpost
    listKind: OutpostList
    plural: outposts
    shortNames:
    - akoutpost
    singular: outpost
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.outpostID
      name: Outpost
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Outpost manages an authentik outpost and the set of providers
          it serves.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OutpostSpec defines an authentik outpost.
            properties:
              adoptionPolicy:
                default: FailOnConflict
                description: |-
                  AdoptionPolicy controls what happens when an outpost with this name
                  already exists in authentik.
                enum:
                - FailOnConflict
                - AdoptExisting
                type: string
              config:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Config is passed to authentik verbatim as the outpost's configuration.
                  The schema differs per outpost type and per authentik version, so it is
                  deliberately not modelled here.

                  Well-known keys include: "log_level", "authentik_host",
                  "authentik_host_browser", "authentik_host_insecure",
                  "object_naming_template", "refresh_interval", "kubernetes_replicas",
                  "kubernetes_namespace", "kubernetes_service_type",
                  "kubernetes_ingress_class_name", "kubernetes_ingress_annotations",
                  "kubernetes_ingress_secret_name", "kubernetes_image_pull_secrets",
                  "kubernetes_json_patches", "kubernetes_disabled_components",
                  "docker_network", "docker_map_ports", "docker_labels" and "docker_image".
                  Consult the authentik documentation for the set your version accepts.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              connectionRef:
                description: |-
                  ConnectionRef selects the authentik instance this outpost is registered
                  with.
                properties:
                  kind:
                    default: AuthentikConnection
                    description: Kind of connection object being referenced.
                    enum:
                    - AuthentikConnection
                    - ClusterAuthentikConnection
                    type: string
                  name:
                    description: Name of the connection object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens to the authentik outpost when this
                  resource is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              name:
                description: Name is the outpost's name in authentik. Defaults to
                  the resource name.
                type: string
              providerRefs:
                description: |-
                  ProviderRefs are the providers this outpost serves. Every reference must
                  resolve before the outpost is registered or updated.
                items:
                  description: |-
                    ProviderReference points at a provider, either one this operator manages in
                    the same namespace or one that already exists in authentik.

                    Declared here but shared with Outpost, which references providers the same
                    way. It lives in this file rather than a shared one only because Application
                    was the first consumer.

                    The reference is resolved through the provider resource's own
                    status.providerID rather than by looking its name up in authentik, so the
                    Kubernetes objects stay the source of truth and renaming a provider inside
                    authentik cannot silently repoint an application at something else.

                    A namespaced provider is always resolved in the application's own namespace.
                    Cross-namespace references are deliberately not supported: they would let
                    anyone who can create a referring resource in one namespace attach a
                    provider, and therefore credentials, owned by another.
                  properties:
                    existingProviderName:
                      description: |-
                        ExistingProviderName is the name of a provider that already exists in
                        authentik and is maintained outside the operator. Use it to attach to a
                        provider somebody else created, rather than one this operator manages.
                      maxLength: 255
                      type: string
                    kind:
                      default: OAuth2Provider
                      description: Kind of provider resource being referenced.
                      enum:
                      - OAuth2Provider
                      - SAMLProvider
                      - ProxyProvider
                      type: string
                    name:
                      description: |-
                        Name of the provider resource in this namespace. Mutually exclusive with
                        existingProviderName.
                      maxLength: 255
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of name or existingProviderName must be set
                    rule: has(self.name) != has(self.existingProviderName)
                type: array
              serviceConnectionRef:
                description: |-
                  ServiceConnectionRef selects the service connection authentik uses to
                  deploy this outpost. Leave unset when you deploy the outpost yourself.
                properties:
                  dockerServiceConnectionName:
                    description: |-
                      DockerServiceConnectionName names a DockerServiceConnection resource in
                      this namespace.
                    maxLength: 253
                    type: string
                  kubernetesServiceConnectionName:
                    description: |-
                      KubernetesServiceConnectionName names a KubernetesServiceConnection
                      resource in this namespace.
                    maxLength: 253
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of kubernetesServiceConnectionName or dockerServiceConnectionName
                    must be set
                  rule: has(self.kubernetesServiceConnectionName) != has(self.dockerServiceConnectionName)
              type:
                description: Type selects which outpost implementation authentik registers.
                enum:
                - proxy
                - ldap
                - radius
                - rac
                type: string
              writeTokenTo:
                description: |-
                  WriteTokenTo creates a Secret holding the outpost's API token and the
                  authentik base URL, which is what a self-hosted outpost needs in order to
                  connect back. Leave unset when authentik deploys the outpost itself.
                properties:
                  hostKey:
                    default: authentik-host
                    description: |-
                      HostKey is the Secret key holding the authentik base URL, which a
                      self-hosted outpost passes as AUTHENTIK_HOST.
                    type: string
                  name:
                    description: Name of the Secret to create in this resource's namespace.
                    minLength: 1
                    type: string
                  tokenKey:
                    default: token
                    description: |-
                      TokenKey is the Secret key holding the outpost API token, which a
                      self-hosted outpost passes as AUTHENTIK_TOKEN.
                    type: string
                required:
                - name
                type: object
            required:
            - connectionRef
            - type
            type: object
          status:
            description: OutpostStatus reports the outpost's state in authentik.
            properties:
              adopted:
                description: |-
                  Adopted records that this resource took over a pre-existing authentik
                  object rather than creating it.
                type: boolean
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncedTime:
                description: LastSyncedTime is when the resource last reconciled successfully.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  reflects.
                format: int64
                type: integer
              outpostID:
                description: OutpostID is authentik's UUID for this outpost.
                type: string
              providerIDs:
                description: |-
                  ProviderIDs are the authentik primary keys every providerRef resolved
                  to, in spec order. It is empty until all of them resolve.
                items:
                  format: int32
                  type: integer
                type: array
              remoteID:
                description: |-
                  RemoteID is authentik's own identifier for the managed object: a numeric
                  primary key for providers and applications, a UUID elsewhere.

                  Once set this is the authoritative handle for the object. Lookups prefer
                  it over the name, so that renaming the object on either side does not
                  cause the operator to lose track of it and create a duplicate.
                type: string
              remoteName:
                description: RemoteName is the name or slug last observed in authentik.
                  Informational.
                type: string
              serviceConnectionID:
                description: ServiceConnectionID is the UUID serviceConnectionRef
                  resolved to.
                type: string
              tokenIdentifier:
                description: |-
                  TokenIdentifier names the authentik token this outpost authenticates
                  with. It is an identifier, not the token itself, which is never placed
                  in status.
                type: string
              tokenSecretName:
                description: TokenSecretName is the Secret the outpost token was written
                  to.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
