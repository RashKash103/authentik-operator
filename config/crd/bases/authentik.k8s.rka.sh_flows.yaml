---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: flows.authentik.k8s.rka.sh
spec:
  group: authentik.k8s.rka.sh
  names:
    kind: Flow
    listKind: FlowList
    plural: flows
    shortNames:
    - akflow
    singular: flow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.existingSlug
      name: Slug
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Flow identifies an authentik flow that providers can reference.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FlowSpec identifies an authentik flow.
            properties:
              connectionRef:
                description: ConnectionRef selects the authentik instance holding
                  the flow.
                properties:
                  kind:
                    default: AuthentikConnection
                    description: Kind of connection object being referenced.
                    enum:
                    - AuthentikConnection
                    - ClusterAuthentikConnection
                    type: string
                  name:
                    description: Name of the connection object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              existingSlug:
                description: |-
                  ExistingSlug is the slug of a flow that already exists in authentik,
                  such as "default-provider-authorization-explicit-consent". The operator
                  resolves it and never modifies the flow.

                  A UUID is also accepted and passed through unchanged.
                maxLength: 255
                minLength: 1
                type: string
            required:
            - connectionRef
            - existingSlug
            type: object
          status:
            description: AdoptedObjectStatus is the status shared by the adopt-only
              kinds.
            properties:
              authentikURL:
                description: |-
                  AuthentikURL is the instance this object resolved against.

                  A UUID only means anything on the instance that issued it, so a
                  cross-namespace reference compares this against the referring resource's
                  own connection and refuses a mismatch. Without the check, pointing at a
                  flow from a namespace wired to a different authentik would send a UUID
                  that instance has never seen.
                type: string
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncedTime:
                description: LastSyncedTime is when the object was last resolved successfully.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  reflects.
                format: int64
                type: integer
              remoteID:
                description: |-
                  RemoteID is authentik's UUID for the resolved object. References are
                  resolved through this, so Kubernetes stays the source of truth and a
                  rename inside authentik cannot silently repoint a provider.
                type: string
              remoteName:
                description: RemoteName is the name or slug last observed in authentik.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
