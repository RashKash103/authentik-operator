---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: dockerserviceconnections.authentik.k8s.rka.sh
spec:
  group: authentik.k8s.rka.sh
  names:
    kind: DockerServiceConnection
    listKind: DockerServiceConnectionList
    plural: dockerserviceconnections
    shortNames:
    - akdockersc
    singular: dockerserviceconnection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.serviceConnectionID
      name: Connection
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DockerServiceConnection manages a Docker outpost service connection in
          authentik.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DockerServiceConnectionSpec defines a Docker service connection.

              Either authentik talks to the Docker socket it is mounted with, in which
              case local is set, or it dials an explicit URL. Setting both is rejected,
              because it hides which of the two endpoints is actually in use.
            properties:
              adoptionPolicy:
                default: FailOnConflict
                description: |-
                  AdoptionPolicy controls what happens when a service connection with this
                  name already exists in authentik.
                enum:
                - FailOnConflict
                - AdoptExisting
                type: string
              connectionRef:
                description: |-
                  ConnectionRef selects the authentik instance this service connection
                  lives in.
                properties:
                  kind:
                    default: AuthentikConnection
                    description: Kind of connection object being referenced.
                    enum:
                    - AuthentikConnection
                    - ClusterAuthentikConnection
                    type: string
                  name:
                    description: Name of the connection object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens to the authentik service connection
                  when this resource is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              local:
                description: |-
                  Local makes authentik use the Docker socket mounted into its own
                  container instead of dialling a URL.
                type: boolean
              name:
                description: |-
                  Name is the service connection's name in authentik. Defaults to the
                  resource name.
                type: string
              tlsAuthentication:
                description: |-
                  TLSAuthentication is the certificate key pair presented to the Docker daemon
                  as a client certificate.
                properties:
                  name:
                    description: Name of the CertificateKeyPair resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace holding the resource. Defaults to the referring resource's own
                      namespace.

                      Naming another namespace requires the operator to be started with
                      cross-namespace references enabled; otherwise the reference is refused
                      rather than quietly resolved somewhere else.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              tlsVerification:
                description: |-
                  TLSVerification is the certificate key pair holding the CA used to verify
                  the Docker daemon's certificate.
                properties:
                  name:
                    description: Name of the CertificateKeyPair resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace holding the resource. Defaults to the referring resource's own
                      namespace.

                      Naming another namespace requires the operator to be started with
                      cross-namespace references enabled; otherwise the reference is refused
                      rather than quietly resolved somewhere else.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              url:
                description: |-
                  URL of the Docker daemon, either "unix:///var/run/docker.sock" for a
                  local socket or "https://hostname:2376" for a remote daemon.
                type: string
            required:
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: 'set exactly one of local: true or url'
              rule: (has(self.local) && self.local) != (has(self.url) && self.url.size()
                > 0)
          status:
            description: DockerServiceConnectionStatus reports the connection's state
              in authentik.
            properties:
              adopted:
                description: |-
                  Adopted records that this resource took over a pre-existing authentik
                  object rather than creating it.
                type: boolean
              authentikURL:
                description: |-
                  AuthentikURL is the instance this object was reconciled against.

                  A reference from another namespace compares this against its own
                  connection and refuses a mismatch. It matters more here than for a UUID:
                  providers are keyed by a small integer, so a primary key from a different
                  authentik will very likely name some other provider rather than fail.
                type: string
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncedTime:
                description: LastSyncedTime is when the resource last reconciled successfully.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  reflects.
                format: int64
                type: integer
              remoteID:
                description: |-
                  RemoteID is authentik's own identifier for the managed object: a numeric
                  primary key for providers and applications, a UUID elsewhere.

                  Once set this is the authoritative handle for the object. Lookups prefer
                  it over the name, so that renaming the object on either side does not
                  cause the operator to lose track of it and create a duplicate.
                type: string
              remoteName:
                description: RemoteName is the name or slug last observed in authentik.
                  Informational.
                type: string
              serviceConnectionID:
                description: |-
                  ServiceConnectionID is authentik's UUID for this service connection. It
                  is what an Outpost's serviceConnectionRef ultimately resolves to, so it
                  is surfaced separately from the generic RemoteID string.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
