# Baseline manager role.
#
# controller-gen regenerates this file from +kubebuilder:rbac markers once the
# controllers land. Until then this is the minimum the manager needs to start
# and to read the credentials a connection points at.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
  labels:
    app.kubernetes.io/name: authentik-operator
rules:
  - apiGroups:
      - authentik.k8s.rka.sh
    resources:
      - authentikconnections
      - clusterauthentikconnections
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - authentik.k8s.rka.sh
    resources:
      - authentikconnections/status
      - clusterauthentikconnections/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - authentik.k8s.rka.sh
    resources:
      - authentikconnections/finalizers
      - clusterauthentikconnections/finalizers
    verbs:
      - update
  # Connections reference API tokens and CA bundles held in Secrets. The
  # operator also writes generated OAuth client credentials back into Secrets.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
