---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentik.k8s.rka.sh
  resources:
  - applications
  - authentikconnections
  - clusterauthentikconnections
  - oauth2providers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentik.k8s.rka.sh
  resources:
  - applications/finalizers
  - authentikconnections/finalizers
  - clusterauthentikconnections/finalizers
  - oauth2providers/finalizers
  verbs:
  - update
- apiGroups:
  - authentik.k8s.rka.sh
  resources:
  - applications/status
  - authentikconnections/status
  - clusterauthentikconnections/status
  - oauth2providers/status
  verbs:
  - get
  - patch
  - update
