blank_issues_enabled: false
contact_links:
  - name: Question or usage help
    url: https://github.com/RashKash103/authentik-operator/discussions
    about: Ask how to do something, or check whether it is already possible.
  - name: authentik itself (not the operator)
    url: https://github.com/goauthentik/authentik/issues
    about: Report bugs in authentik upstream rather than in this operator.
  - name: Security vulnerability
    url: https://github.com/RashKash103/authentik-operator/security/advisories/new
    about: Report privately. Please do not open a public issue.
