name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Never cancel a release mid-flight.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    # Gate: a tag only becomes a release if the full CI suite passes on the
    # exact commit the tag points at.
    name: CI gate
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  release:
    name: build, publish and release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
      packages: write # push to GHCR
      id-token: write # keyless signing for the provenance attestation
      attestations: write # record the attestation against the repo
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Git ref names forbid spaces and a few metacharacters but permit
          # $ ( ) ` ; & | - enough to smuggle a command substitution into any
          # step that interpolates a derived value into a shell. This job holds
          # contents/packages/id-token/attestations write and an authenticated
          # GHCR session, so a crafted tag would be able to push a backdoored
          # image and sign it with valid provenance. Refuse anything that is not
          # a plain semver tag.
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "refusing to release from tag '${tag}': expected vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi

          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "image=${image}"
            # The version, not the tag: docker/metadata-action strips the
            # leading v when it derives semver tags, so the image is published
            # as :0.1.0 and :v0.1.0 never exists. Using the tag here put a
            # reference nobody could pull into the release notes.
            echo "image_ref=${image}:${version}"
            # Charts are pushed under the owner, not the repository: helm
            # appends the chart name to the reference, so pushing to
            # oci://ghcr.io/<owner>/charts yields
            # oci://ghcr.io/<owner>/charts/authentik-operator.
            echo "chart_repo=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
            echo "chart_ref=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/authentik-operator"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=authentik-operator
            org.opencontainers.image.description=Kubernetes operator that manages authentik resources declaratively
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # In-registry SBOM and max-detail SLSA provenance attestations.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The SBOM is written into dist/, but make bundle - which creates that
      # directory - runs after this step. Without it the action fails with
      # ENOENT and nothing downstream publishes.
      - name: Prepare the artifact directory
        run: mkdir -p dist

      - name: Generate SBOM for the release
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: authentik-operator-${{ steps.version.outputs.version }}.spdx.json
          output-file: dist/authentik-operator-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Render install.yaml
        env:
          # Pinned by digest, not tag: the provenance attestation covers a
          # digest, and a tag can be re-pushed by anyone with packages:write,
          # so a tag-pinned manifest defeats the chain at the point of use.
          IMAGE_PINNED: ${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          make bundle IMG="${IMAGE_PINNED}"
          test -s dist/install.yaml
          grep -q "${IMAGE_PINNED}" dist/install.yaml

      - name: Package the Helm chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm package charts/authentik-operator \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}" \
            --destination dist
          ls -l dist

      # Published as an OCI artifact so the chart can be consumed the same way
      # the image is - one registry, one credential, and no separate chart
      # repository to host. Flux and Argo both pull OCI charts natively.
      - name: Push the Helm chart to GHCR as an OCI artifact
        id: chart_push
        env:
          # Through env rather than interpolated: an expanded ${{ }} secret is
          # materialised into a temp script on the runner for the life of the
          # step, where any concurrent process can read it.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          CHART_VERSION: ${{ steps.version.outputs.version }}
          CHART_REPO: ${{ steps.version.outputs.chart_repo }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | \
            helm registry login ghcr.io --username "${GHCR_USER}" --password-stdin
          helm push "dist/authentik-operator-${CHART_VERSION}.tgz" "${CHART_REPO}" 2>&1 | tee push.log
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # Separate and always-run: a failed push must not leave the token sitting
      # in ~/.config/helm/registry/config.json for the rest of the job.
      - name: Log out of the chart registry
        if: always()
        run: helm registry logout ghcr.io || true

      # A push that silently produced something unpullable would only be found
      # by the first person trying to install it.
      # The image was attested above; without this the chart would ship with no
      # provenance at all, while the release body invites people to install it.
      - name: Attest the published chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/authentik-operator
          subject-digest: ${{ steps.chart_push.outputs.digest }}
          push-to-registry: true

      - name: Verify the published chart is pullable
        env:
          CHART_REF: ${{ steps.version.outputs.chart_ref }}
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm show chart "${CHART_REF}" --version "${CHART_VERSION}"

      # install.yaml and the packaged chart are attached as release assets, and
      # release assets are mutable by anyone with contents:write. Without an
      # attestation a consumer following the kubectl apply instruction has
      # nothing to verify.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/install.yaml
            dist/authentik-operator-*.tgz
            dist/authentik-operator-*.spdx.json

      - name: Create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/install.yaml
            dist/authentik-operator-${{ steps.version.outputs.version }}.tgz
            dist/authentik-operator-${{ steps.version.outputs.version }}.spdx.json
          body: |
            ## Container image

            ```
            ${{ steps.version.outputs.image_ref }}
            ```

            Digest: `${{ steps.build.outputs.digest }}`
            Platforms: `linux/amd64`, `linux/arm64`

            ## Install

            ```sh
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/install.yaml
            ```

            or with Helm, from the chart published as an OCI artifact:

            ```sh
            helm install authentik-operator \
              ${{ steps.version.outputs.chart_ref }} \
              --version ${{ steps.version.outputs.version }} \
              --namespace authentik-operator-system --create-namespace
            ```

            The packaged chart is also attached to this release as a `.tgz`.

            ## Verifying

            Provenance is attested for the container image, the Helm chart
            pushed to GHCR, and the file assets attached to this release. An
            SBOM for the image is attached as `.spdx.json`.

            ```sh
            # Image
            gh attestation verify oci://${{ steps.version.outputs.image_ref }} \
              --repo ${{ github.repository }}

            # Chart
            gh attestation verify \
              oci://ghcr.io/${{ github.repository_owner }}/charts/authentik-operator:${{ steps.version.outputs.version }} \
              --repo ${{ github.repository }}

            # A downloaded release asset
            gh attestation verify install.yaml --repo ${{ github.repository }}
            ```

            `install.yaml` pins the operator image by digest, so what it
            deploys is exactly what was attested above.
