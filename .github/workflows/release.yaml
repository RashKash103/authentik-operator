name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Never cancel a release mid-flight.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    # Gate: a tag only becomes a release if the full CI suite passes on the
    # exact commit the tag points at.
    name: CI gate
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  release:
    name: build, publish and release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
      packages: write # push to GHCR
      id-token: write # keyless signing for the provenance attestation
      attestations: write # record the attestation against the repo
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "image=${image}"
            echo "image_ref=${image}:${tag}"
            # Charts are pushed under the owner, not the repository: helm
            # appends the chart name to the reference, so pushing to
            # oci://ghcr.io/<owner>/charts yields
            # oci://ghcr.io/<owner>/charts/authentik-operator.
            echo "chart_repo=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
            echo "chart_ref=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/authentik-operator"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=authentik-operator
            org.opencontainers.image.description=Kubernetes operator that manages authentik resources declaratively
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # In-registry SBOM and max-detail SLSA provenance attestations.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM for the release
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: authentik-operator-${{ steps.version.outputs.version }}.spdx.json
          output-file: dist/authentik-operator-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Render install.yaml
        run: |
          set -euo pipefail
          make bundle IMG="${{ steps.version.outputs.image_ref }}"
          test -s dist/install.yaml
          grep -q "${{ steps.version.outputs.image_ref }}" dist/install.yaml

      - name: Package the Helm chart
        run: |
          set -euo pipefail
          helm package charts/authentik-operator \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist
          ls -l dist

      # Published as an OCI artifact so the chart can be consumed the same way
      # the image is - one registry, one credential, and no separate chart
      # repository to host. Flux and Argo both pull OCI charts natively.
      - name: Push the Helm chart to GHCR as an OCI artifact
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push \
            "dist/authentik-operator-${{ steps.version.outputs.version }}.tgz" \
            "${{ steps.version.outputs.chart_repo }}"
          helm registry logout ghcr.io

      # A push that silently produced something unpullable would only be found
      # by the first person trying to install it.
      - name: Verify the published chart is pullable
        run: |
          set -euo pipefail
          helm show chart \
            "${{ steps.version.outputs.chart_ref }}" \
            --version "${{ steps.version.outputs.version }}"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/install.yaml
            dist/authentik-operator-${{ steps.version.outputs.version }}.tgz
            dist/authentik-operator-${{ steps.version.outputs.version }}.spdx.json
          body: |
            ## Container image

            ```
            ${{ steps.version.outputs.image_ref }}
            ```

            Digest: `${{ steps.build.outputs.digest }}`
            Platforms: `linux/amd64`, `linux/arm64`

            ## Install

            ```sh
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/install.yaml
            ```

            or with Helm, from the chart published as an OCI artifact:

            ```sh
            helm install authentik-operator \
              ${{ steps.version.outputs.chart_ref }} \
              --version ${{ steps.version.outputs.version }} \
              --namespace authentik-operator-system --create-namespace
            ```

            The packaged chart is also attached to this release as a `.tgz`.

            Provenance and SBOM attestations are attached to the image in GHCR
            and can be verified with `gh attestation verify`.
