name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "hack/gen-docs.py"
      - "supported-versions.yaml"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "hack/gen-docs.py"
      - "supported-versions.yaml"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight Pages deployment: a cancelled deploy can leave
  # the published site on a half-applied version.
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZENSICAL_VERSION: "0.0.62"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: pip install "zensical==${ZENSICAL_VERSION}" "pyyaml==6.0.3"

      - name: Verify derived pages are up to date
        run: python3 hack/gen-docs.py --check

      # Strict mode fails on warnings, including links to pages that do not
      # exist. A broken link is far cheaper to fix here than after publishing.
      - name: Build site
        run: zensical build --clean --strict

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Pages must already be enabled with the "GitHub Actions" source. The
        # action's enablement:true cannot do it for us: creating a Pages site
        # needs admin rights that GITHUB_TOKEN is not granted, and the attempt
        # fails with "Resource not accessible by integration". Enable it once
        # per repository, in Settings > Pages or with:
        #   gh api --method POST repos/OWNER/REPO/pages -f build_type=workflow
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Deploys the uploaded artifact directly. There is no gh-pages branch, so
    # the published site is never a commit anyone has to review or revert.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
